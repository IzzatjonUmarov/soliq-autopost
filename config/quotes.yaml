# Утренняя «цитата дня» (07:00): готовые цитаты со страниц Викицитатника (ru.wikiquote.org).
# Текст и автор берутся как в источнике, в посте — ссылка на страницу. Бот ничего не сочиняет.
# Цитаты с пометками «приписывается», «сомнительно» и т. п. пропускаются автоматически.
#
# Страницы идут по кругу: каждый день — следующая тема. Опубликованные цитаты не повторяются.
pages:
  - Деньги
  - Богатство
  - Долг
  - Труд
  - Бедность
  - Кредит
  - Налог
  - Экономика
  - Алчность
  - Предпринимательство

# длина цитаты (символов): короткие лучше читаются в подписи к картинке
min_length: 25
max_length: 260

# цитаты, где встречаются эти слова, не публикуются (грубость, политика, ирония не к месту)
blocked_words:
  - секс
  - навоз
  - отнимать деньги
  - березовск
  - водк
  - проститу
  - чёрт
  - дьявол
  - убий
  - война
